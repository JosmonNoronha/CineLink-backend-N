name: Streaming catalog sync

on:
  schedule:
    - cron: '30 7 * * *'   # daily, 13:00 IST: newest uploads (about 8 quota units)
    - cron: '30 7 * * 0'   # Sundays, 13:00 IST: also verify stored videos (about 100 units)
  workflow_dispatch:
    inputs:
      mode:
        description: 'recent or verify'
        default: 'recent'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - name: Recent sync
        if: github.event_name == 'schedule' || inputs.mode == 'recent'
        run: node scripts/sync-streaming.js 8630 --mode recent
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Verify stored videos (Sundays or manual)
        if: github.event.schedule == '30 7 * * 0' || inputs.mode == 'verify'
        run: node scripts/sync-streaming.js 8630 --mode verify
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}