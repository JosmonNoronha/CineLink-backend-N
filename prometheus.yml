global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'cinelink-backend'
    metrics_path: '/api/metrics'
    # /api/metrics requires OPS_SECRET (or METRICS_SECRET) as a bearer token.
    # Put the secret in ./secrets/metrics_secret (a file containing only the value; keep it out of git).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_secret
    static_configs:
      # When running Prometheus on the host and backend on host
      - targets: ['localhost:5001']
      # When running Prometheus in Docker and backend on host (Windows/Mac)
      - targets: ['host.docker.internal:5001']
